<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>ARSpace</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{--ink:#0a0a0f;--cream:#f5f0e8;--warm:#e8dcc8;--accent:#c84b2f;--gold:#d4a853;--mid:#7a6f63;--glass:rgba(10,10,15,0.65);}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'DM Sans',sans-serif;}

    #splash{position:fixed;inset:0;background:var(--ink);overflow-y:auto;z-index:50;padding:2rem 1.5rem 4rem;display:flex;flex-direction:column;align-items:center;transition:opacity .4s,transform .4s;}
    #splash.hide{opacity:0;transform:scale(1.03);pointer-events:none;}
    .logo{display:flex;align-items:center;gap:.6rem;align-self:flex-start;margin-bottom:2rem;}
    .logo-box{width:38px;height:38px;border:2px solid var(--gold);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;}
    .logo-txt{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;color:var(--cream);}
    .logo-txt span{color:var(--gold);}
    h1{font-family:'Syne',sans-serif;font-size:clamp(1.7rem,6vw,2.6rem);font-weight:800;color:var(--cream);line-height:1.1;letter-spacing:-.03em;margin-bottom:.6rem;align-self:flex-start;}
    h1 em{font-style:normal;color:var(--gold);}
    .sub{font-size:.9rem;color:var(--mid);line-height:1.6;margin-bottom:1.8rem;align-self:flex-start;}
    .lbl{font-family:'Syne',sans-serif;font-size:.6rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--mid);margin-bottom:.8rem;align-self:flex-start;}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;width:100%;max-width:400px;margin-bottom:2rem;}
    .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:1rem .8rem;display:flex;flex-direction:column;align-items:center;gap:.6rem;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
    .card:active{background:rgba(212,168,83,.12);border-color:var(--gold);transform:scale(.97);}
    .qr-box{background:#fff;border-radius:7px;padding:5px;width:96px;height:96px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .qr-box canvas,.qr-box img{display:block!important;width:86px!important;height:86px!important;}
    .scan-line{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);pointer-events:none;animation:scan 2.5s ease-in-out infinite;}
    @keyframes scan{0%{top:8%;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:92%;opacity:0}}
    .card-name{font-family:'Syne',sans-serif;font-size:.7rem;font-weight:700;color:var(--cream);text-align:center;}
    .card-dims{font-size:.58rem;color:var(--mid);text-align:center;}
    .badge{font-size:.52rem;font-weight:700;background:rgba(212,168,83,.15);color:var(--gold);border-radius:4px;padding:2px 6px;letter-spacing:.08em;}
    .steps{display:flex;gap:.6rem;width:100%;max-width:400px;}
    .step{flex:1;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:.8rem .6rem;text-align:center;}
    .step-n{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;color:var(--gold);margin-bottom:.25rem;}
    .step-t{font-size:.6rem;color:var(--mid);}

    /* AR */
    #ar{position:fixed;inset:0;display:none;flex-direction:column;background:#111;z-index:60;}
    #ar.on{display:flex;}

    model-viewer{
      width:100%;
      flex:1;
      --poster-color:#111111;
    }

    #topbar{position:absolute;top:0;left:0;right:0;padding:max(env(safe-area-inset-top),14px) 14px 14px;background:linear-gradient(to bottom,rgba(0,0,0,.85),transparent);display:flex;align-items:center;justify-content:space-between;z-index:10;}
    .hbtn{width:42px;height:42px;border-radius:11px;border:1px solid rgba(255,255,255,.18);background:var(--glass);color:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);}
    .pill{background:var(--glass);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:5px 13px 5px 9px;display:flex;align-items:center;gap:7px;backdrop-filter:blur(10px);}
    .dot{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:blink 2s infinite;}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    .pill-nm{font-family:'Syne',sans-serif;font-size:.78rem;font-weight:600;color:#fff;}

    #ctrl{position:absolute;bottom:0;left:0;right:0;padding:14px 14px max(env(safe-area-inset-bottom),18px);background:linear-gradient(to top,rgba(0,0,0,.9),transparent);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:10;}
    .brow{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:center;}
    .abtn{height:50px;border-radius:13px;border:none;cursor:pointer;font-family:'Syne',sans-serif;font-weight:700;font-size:.8rem;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 1.2rem;}
    .abtn-main{background:var(--gold);color:var(--ink);box-shadow:0 4px 18px rgba(212,168,83,.4);}
    .abtn-main:active{transform:scale(.95);}
    .abtn-sm{background:var(--glass);border:1px solid rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(8px);}
    #dims-badge{background:var(--glass);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:6px 14px;font-family:'Syne',sans-serif;font-size:.75rem;font-weight:700;color:#fff;backdrop-filter:blur(10px);text-align:center;}

    #panel{position:absolute;bottom:0;left:0;right:0;background:rgba(245,240,232,.97);border-radius:22px 22px 0 0;padding:1.3rem 1.3rem max(env(safe-area-inset-bottom),18px);transform:translateY(100%);transition:transform .38s cubic-bezier(.34,1.56,.64,1);z-index:20;}
    #panel.on{transform:translateY(0);}
    .hdl{width:38px;height:4px;border-radius:2px;background:rgba(0,0,0,.12);margin:0 auto 1rem;}
    .prow{display:flex;gap:.9rem;align-items:flex-start;margin-bottom:.9rem;}
    .pico{font-size:2rem;background:var(--warm);border-radius:11px;padding:.5rem;flex-shrink:0;}
    .pname{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:800;color:var(--ink);margin-bottom:.15rem;}
    .pdims{font-size:.75rem;color:var(--mid);margin-bottom:.35rem;}
    .pprice{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;color:var(--accent);}
    .pbtns{display:flex;gap:.7rem;}
    .pb{flex:1;padding:.82rem;border-radius:11px;border:none;font-family:'Syne',sans-serif;font-weight:700;font-size:.82rem;cursor:pointer;}
    .pb1{background:var(--ink);color:#fff;}
    .pb2{background:var(--warm);color:var(--ink);}
    #xpanel{position:absolute;top:.9rem;right:.9rem;width:28px;height:28px;border-radius:50%;background:var(--warm);border:none;cursor:pointer;font-size:.85rem;}

    #toast{position:fixed;bottom:160px;left:50%;transform:translateX(-50%) translateY(14px);background:rgba(10,10,15,.93);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:8px 18px;color:#fff;font-size:.78rem;backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:all .28s;z-index:9999;white-space:nowrap;}
    #toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
    #load{position:fixed;inset:0;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;z-index:200;transition:opacity .4s;}
    #load.off{opacity:0;pointer-events:none;}
    .sp{width:42px;height:42px;border:3px solid rgba(212,168,83,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .sp-t{font-family:'Syne',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);}
  </style>
</head>
<body>

<div id="load"><div class="sp"></div><div class="sp-t">Cargando ARSpace…</div></div>

<div id="splash">
  <div class="logo"><div class="logo-box">🚲</div><div class="logo-txt">AR<span>Space</span></div></div>
  <h1>Visualizá el equipo<br/>en <em>tu espacio</em></h1>
  <p class="sub">Escaneá el QR o tocá la tarjeta para ver el producto en realidad aumentada a escala real.</p>
  <p class="lbl">▸ Escaneá o tocá un producto</p>
  <div class="grid" id="grid"></div>
  <p class="lbl">▸ ¿Cómo funciona?</p>
  <div class="steps">
    <div class="step"><div class="step-n">1</div><div class="step-t">Escaneá el QR</div></div>
    <div class="step"><div class="step-n">2</div><div class="step-t">Apuntá al piso</div></div>
    <div class="step"><div class="step-n">3</div><div class="step-t">Colocá y rotá</div></div>
  </div>
</div>

<div id="ar">
  <div id="topbar">
    <button class="hbtn" onclick="exitAR()">←</button>
    <div class="pill"><div class="dot"></div><div class="pill-nm" id="hud-nm">…</div></div>
    <button class="hbtn" onclick="exitAR()">✕</button>
  </div>

  <model-viewer
    id="mv"
    alt="Producto AR"
    shadow-intensity="1.5"
    shadow-softness="0.8"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    auto-rotate-delay="2000"
    rotation-per-second="15deg"
    environment-image="neutral"
    exposure="1.0"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed"
    style="background-color:#1a1a2e;"
  ></model-viewer>

  <div id="ctrl">
    <div id="dims-badge">📐 …</div>
    <div class="brow">
      <button class="abtn abtn-sm" onclick="toggleRotate()">⟳ Rotar</button>
      <button class="abtn abtn-main" onclick="launchNativeAR()">📱 Ver en tu espacio</button>
      <button class="abtn abtn-sm" onclick="showPanel()">ℹ️ Info</button>
    </div>
  </div>

  <div id="panel">
    <button id="xpanel" onclick="closePanel()">✕</button>
    <div class="hdl"></div>
    <div class="prow">
      <div class="pico" id="pico">🚲</div>
      <div>
        <div class="pname" id="pnm">…</div>
        <div class="pdims" id="pdims">…</div>
        <div class="pprice" id="ppr">…</div>
      </div>
    </div>
    <div class="pbtns">
      <button class="pb pb2" onclick="closePanel()">Seguir viendo</button>
      <button class="pb pb1" onclick="toast('✅ ¡Agregado al carrito!')">🛒 Agregar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════
//  CATÁLOGO DE PRODUCTOS
//  glb: ruta al archivo en models/
//  sz:  [ancho, alto, profundidad] en METROS
// ═══════════════════════════════════════════════════════
const P = {
  bici: {
    name:  'Bici Armada',
    emoji: '🚲',
    price: '$150.000',
    dims:  '60×74×123 cm · Gris',
    sz:    [0.60, 1.23, 0.74],
    glb:   'models/BICI_ARMADA.glb',
  },
  // ── Agregá más productos acá ──
  // otro: {
  //   name:  'Nombre',
  //   emoji: '🪑',
  //   price: '$00.000',
  //   dims:  '00×00×00 cm · Color',
  //   sz:    [ancho, alto, prof],
  //   glb:   'models/archivo.glb',
  // },
};
// ═══════════════════════════════════════════════════════

let autoRotating = true;

function buildCards() {
  const g = document.getElementById('grid');
  const base = window.location.href.split('?')[0];
  Object.entries(P).forEach(([id, p]) => {
    const c = document.createElement('div');
    c.className = 'card';
    c.onclick = () => launchAR(id);
    const sl = document.createElement('div'); sl.className = 'scan-line'; c.appendChild(sl);
    const qb = document.createElement('div'); qb.className = 'qr-box'; qb.id = 'q' + id; c.appendChild(qb);
    c.innerHTML += `<div class="card-name">${p.emoji} ${p.name}</div><div class="card-dims">${p.dims.split('·')[0].trim()}</div><div class="badge">AR READY</div>`;
    c.insertBefore(qb, c.children[1]);
    g.appendChild(c);
    try {
      new QRCode(document.getElementById('q' + id), {
        text: base + '?product=' + id,
        width: 86, height: 86,
        colorDark: '#000000', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch(e) {}
  });
}

function launchAR(id) {
  const p = P[id];
  if (!p) return;

  document.getElementById('hud-nm').textContent = p.name;
  document.getElementById('pico').textContent = p.emoji;
  document.getElementById('pnm').textContent = p.name;
  document.getElementById('pdims').textContent = p.dims;
  document.getElementById('ppr').textContent = p.price;
  const [w,h,d] = p.sz;
  document.getElementById('dims-badge').textContent =
    `📐 ${Math.round(w*100)}×${Math.round(d*100)}×${Math.round(h*100)} cm`;

  const mv = document.getElementById('mv');
  mv.src = p.glb;
  mv.alt = p.name;
  // Reset auto-rotate
  autoRotating = true;
  mv.setAttribute('auto-rotate', '');

  document.getElementById('ar').classList.add('on');
  document.getElementById('splash').classList.add('hide');
  closePanel();
}

function exitAR() {
  document.getElementById('ar').classList.remove('on');
  document.getElementById('splash').classList.remove('hide');
  document.getElementById('mv').src = '';
  closePanel();
}

function launchNativeAR() {
  const mv = document.getElementById('mv');
  if (mv.canActivateAR) {
    mv.activateAR();
  } else {
    toast('⚠️ AR no disponible en este dispositivo. Probá en Android con Chrome o en iPhone con Safari.');
  }
}

function toggleRotate() {
  const mv = document.getElementById('mv');
  autoRotating = !autoRotating;
  autoRotating ? mv.setAttribute('auto-rotate','') : mv.removeAttribute('auto-rotate');
  toast(autoRotating ? '⟳ Auto-rotación activada' : '⏸ Rotación pausada');
}

function showPanel()  { document.getElementById('panel').classList.add('on'); }
function closePanel() { document.getElementById('panel').classList.remove('on'); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 2800);
}

window.addEventListener('load', () => {
  buildCards();
  const mv = document.getElementById('mv');
  mv.addEventListener('load', () => toast('✅ Modelo cargado'));
  mv.addEventListener('ar-status', e => {
    if (e.detail.status === 'session-started') toast('📱 AR activado — apuntá al piso');
  });
  setTimeout(() => {
    document.getElementById('load').classList.add('off');
    const pid = new URLSearchParams(window.location.search).get('product');
    if (pid && P[pid]) setTimeout(() => launchAR(pid), 300);
  }, 800);
});
</script>
</body>
</html>
